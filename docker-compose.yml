services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: audit_demo
      MYSQL_USER: audit
      MYSQL_PASSWORD: audit
      MYSQL_ROOT_PASSWORD: root-demo-only
    ports: ["3306:3306"]
    volumes: ["audit_mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  audit_mysql:
